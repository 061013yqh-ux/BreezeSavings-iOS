name: BreezeSavings
options:
  bundleIdPrefix: com.breeze
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: 17.0
targets:
  BreezeSavings:
    type: application
    platform: iOS
    sources: [BreezeSavings]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.breeze.savings
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: BreezeSavings/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: BreezeSavings/Info.plist
